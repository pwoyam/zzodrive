[project]
name = "zzodrive"
version = "1.0.0"
description = "Turn your Telegram into a personal cloud drive"
requires-python = ">=3.9"
dependencies = [
    "telethon>=1.36.0",
    "cryptography>=42.0.0",
    "flask>=3.0.0",
]

[project.scripts]
zzodrive = "run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zzodrive"]

[tool.setuptools.package-data]
"zzodrive.web" = ["templates/*.html", "static/**/*"]
